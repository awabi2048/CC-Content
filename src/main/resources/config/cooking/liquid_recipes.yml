config_version: 1

# 液体構成を完全一致させるレシピです。液体は先に釜へ投入して状態として保持し、
# 必要量が揃った時だけ加工を開始します。
recipes:
  sea_salt:
    equipment: CAULDRON
    heat: NORMAL
    liquid_inputs: { sea_water: 3 }
    duration_seconds: 60
    exp: 0
    processing_levels: [3, 2, 1]
    result:
      custom_item_id: cooking.salt
      base_material: QUARTZ
      max_stack_size: 64
      amount_per_scale: 1
    residual_liquids: { bittern: 1 }
    liquid_outputs:
      bittern:
        custom_item_id: cooking.nigari_bottle
        container: GLASS_BOTTLE
        liquid_pane: GRAY_STAINED_GLASS_PANE

  tofu:
    equipment: CAULDRON
    heat: NORMAL
    liquid_inputs: { soy_milk: 1, bittern: 1 }
    duration_seconds: 30
    exp: 0
    result:
      custom_item_id: cooking.tofu
      base_material: SNOWBALL
      max_stack_size: 64
      amount_per_scale: 4
